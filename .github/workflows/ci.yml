name: Production foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-foundation-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:production
      - run: npm audit --omit=dev --omit=optional --audit-level=high

  backend:
    name: Backend lint, tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: executive_ai_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: executive_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U executive_ai_ci -d executive_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_MODE: production
      DATABASE_URL: postgresql+psycopg://executive_ai_ci:ci_ephemeral_password@127.0.0.1:5432/executive_ai_ci
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://executive_ai_ci:ci_ephemeral_password@127.0.0.1:5432/executive_ai_ci
      FILE_STORAGE_ROOT: /tmp/executive-ai-files
      STORAGE_ROOT: /tmp/executive-ai-files
      COOKIE_SECURE: "false"
      SESSION_COOKIE_SECURE: "false"
      SEED_DEMO_DATA: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      TRUSTED_HOSTS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          set -euo pipefail
          session_secret="$(openssl rand -hex 32)"
          csrf_secret="$(openssl rand -hex 32)"
          file_encryption_key="$(openssl rand -base64 32 | tr -d '\n')"
          audit_hmac_key="$(openssl rand -hex 32)"
          for secret in \
            "${session_secret}" \
            "${csrf_secret}" \
            "${file_encryption_key}" \
            "${audit_hmac_key}"; do
            printf '::add-mask::%s\n' "${secret}"
          done
          {
            printf 'SESSION_SECRET=%s\n' "${session_secret}"
            printf 'CSRF_SECRET=%s\n' "${csrf_secret}"
            printf 'FILE_ENCRYPTION_KEY=%s\n' "${file_encryption_key}"
            printf 'AUDIT_HMAC_KEY=%s\n' "${audit_hmac_key}"
          } >> "${GITHUB_ENV}"
      - run: python -m pip install uv==0.10.5
      - run: uv sync --frozen --extra dev
        working-directory: services/api
      - run: uv run --frozen --extra dev ruff check src tests
        working-directory: services/api
      - run: uv run --frozen --extra dev pytest -m "not postgres"
        working-directory: services/api
      - name: PostgreSQL API concurrency and key-rotation tests
        run: >-
          uv run --frozen --extra dev pytest -m postgres
          tests/test_postgres_idempotency.py
          tests/test_postgres_admin_safety.py
          tests/test_postgres_key_rotation.py
        working-directory: services/api
      - run: uv run --frozen alembic upgrade head
        working-directory: services/api
      - run: uv sync --frozen --extra dev
        working-directory: services/worker
      - run: uv run --frozen --extra dev ruff check src tests
        working-directory: services/worker
      - run: uv run --frozen --extra dev pytest -m "not postgres"
        working-directory: services/worker
      - name: PostgreSQL worker lease concurrency test
        run: uv run --frozen --extra dev pytest -m postgres tests/test_postgres_leases.py
        working-directory: services/worker

  infrastructure:
    name: Compose and deployment invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: ./scripts/test-infra.sh
      - name: Reject tracked runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(runtime|backups|secrets)/|\.(pem|key|secret)$'; then
            echo 'Runtime secret or backup material is tracked.' >&2
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  recovery-drill:
    name: Full Compose recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: ./scripts/ci-recovery-drill.sh

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [frontend, backend, infrastructure, recovery-drill, secret-scan, dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            context: .
            dockerfile: Dockerfile.web
          - component: api
            context: services/api
            dockerfile: services/api/Dockerfile
          - component: worker
            context: .
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
