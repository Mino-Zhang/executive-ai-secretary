upstream executive_ai_api {
    server api:8000;
    keepalive 16;
}

upstream executive_ai_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    client_max_body_size 52m;
    limit_conn per_client 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

    location = /_gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"gateway"}\n';
    }

    location = /health/live {
        proxy_pass http://executive_ai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health/ready {
        proxy_pass http://executive_ai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        proxy_pass http://executive_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This gateway is the only exposed listener. Never preserve a caller-supplied
        # forwarding chain, otherwise audit IPs and login throttling are spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://executive_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://executive_ai_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Preserve the browser-facing port for metadata URLs. Nginx's `$host`
        # intentionally strips it, which would otherwise make icons and social
        # images fail the same-origin content security policy on local installs.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Server;
    }
}
